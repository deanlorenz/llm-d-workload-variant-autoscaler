# WVA SAT-2 TP=1 SCENARIO — single-variant, WVA saturation-V2 autoscaling
#
# Deploys the model set via BENCHMARK_MODEL_ID as a single TP=1 decode
# deployment managed by WVA with the saturation-V2 cost-aware optimizer.
#
# Topology:
#
#   Gateway → InferencePool (EPP with flowControl)
#                   |
#           vLLM decode TP=1
#           WVA controller (Sat-2) → KEDA ScaledObject
#
# Usage:
#
#   # Deploy
#   make benchmark-standup BENCHMARK_NAMESPACE=$NS BENCHMARK_SPEC=guides/wva-sat2-tp1 \
#     BENCHMARK_SKIP_PROMETHEUS_ADAPTER=true
#
#   # Configure the (single) variant with WVA and create its KEDA ScaledObject
#   make benchmark-configure-variants BENCHMARK_NAMESPACE=$NS \
#     VARIANT_CONFIG=hack/benchmark/scenarios/guides/variants/sat2-tp1.yaml
#
#   # Enable saturation-V2 cost-aware optimizer
#   make benchmark-enable-v2-saturation BENCHMARK_NAMESPACE=$NS
#
#   # Run prefill-heavy workload
#   make benchmark-run BENCHMARK_NAMESPACE=$NS BENCHMARK_SPEC=guides/wva-sat2-tp1 \
#     BENCHMARK_HARNESS=inference-perf BENCHMARK_WORKLOAD=prefill_heavy.yaml
#
#   # Wait for replicas to scale back to 1 (~10 min cooldown), then run decode-heavy
#   make benchmark-run BENCHMARK_NAMESPACE=$NS BENCHMARK_SPEC=guides/wva-sat2-tp1 \
#     BENCHMARK_HARNESS=inference-perf BENCHMARK_WORKLOAD=decode_heavy.yaml
#
#   # Teardown
#   make benchmark-teardown BENCHMARK_NAMESPACE=$NS BENCHMARK_SPEC=guides/wva-sat2-tp1

# ============================================================================
# SHARED
# ============================================================================
shared:
  modelservice:
    enabled: true
  standalone:
    enabled: false

  # --------------------------------------------------------------------------
  # WVA — saturation-V2 cost-aware optimizer
  # --------------------------------------------------------------------------
  wva:
    enabled: true
    wellLitPath: inference-scheduling
    namespace: ""
    image:
      repository: __WVA_IMAGE_REPO__
      tag: __WVA_IMAGE_TAG__
    replicaCount: 1
    controller:
      enabled: true
    namespaceScoped: true
    metrics:
      enabled: true
      port: 8443
      secure: true
    prometheus:
      baseUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local
      port: 9091
    vllmService:
      enabled: true

  chartVersions:
    wva: __WVA_CHART_VERSION__
    prometheusAdapter: __PROMETHEUS_ADAPTER_CHART_VERSION__

  # --------------------------------------------------------------------------
  # IMAGE OVERRIDES — pin vllm-openai (VLLM_IMAGE_REPO:VLLM_IMAGE_TAG in
  # hack/benchmark/.env) so vllm:cache_config_info is emitted (required by
  # WVA Sat-2 for real KV capacity).
  # --------------------------------------------------------------------------
  # The load-bearing key is `images.vllm` -- that is what
  # config/templates/jinja/13_ms-values.yaml.j2 reads for the decode and
  # prefill vllm containers (lines 382 and 785). `images.vllmOpenai` is
  # documented upstream as "Not currently used by any template (reserved)"
  # (llm-d-benchmark config/README.md:1339), so setting only that key -- as
  # this scenario did until 2026-08-06 -- was inert: every deploy silently
  # fell through to defaults.yaml's `vllm-openai_version: v0.20.2`. Both keys
  # are set here so the pin survives if a future template switches keys.
  images:
    vllm:
      repository: __VLLM_IMAGE_REPO__
      tag: __VLLM_IMAGE_TAG__
    vllmOpenai:
      repository: __VLLM_IMAGE_REPO__
      tag: __VLLM_IMAGE_TAG__
    # Harness image, used by the download job, the harness pod and the
    # data-access pod. Unset, llm-d-benchmark's defaults.yaml decides the in-pod
    # inference-perf version silently -- and our host-side output-token
    # correction is written against a specific version's behaviour. The
    # unsubstituted-placeholder guard in the Makefile turns a missing .env pin
    # into a hard failure rather than a silent default.
    benchmark:
      repository: __HARNESS_IMAGE_REPO__
      tag: __HARNESS_IMAGE_TAG__

  # --------------------------------------------------------------------------
  # EPP PLUGIN CONFIG — flowControl gate required for KEDA trigger
  #
  # NOTE: key is `router.epp.*`, not a top-level `inferenceExtension:` block --
  # same wrong-key mistake as two-variant-wva.yaml, root-caused 2026-07-26.
  # `inferenceExtension.pluginsConfigFile`/`pluginsCustomConfig` is
  # llm-d-benchmark's GUIDE input-format naming (its "convert-guide" skill),
  # not a key a benchmark SCENARIO file is templated against. The real key is
  # `router.epp.pluginsConfigFile`/`pluginsCustomConfig` (confirmed against
  # the rendered config.yaml and llm-d-benchmark's workload/README.md).
  # --------------------------------------------------------------------------
  router:
    epp:
      pluginsConfigFile: "wva-plugins.yaml"
      pluginsCustomConfig:
        wva-plugins.yaml: |
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          featureGates:
            - flowControl
          plugins:
            - type: queue-scorer
            - type: kv-cache-utilization-scorer
            - type: prefix-cache-scorer
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3

  # --------------------------------------------------------------------------
  # VLLM COMMON
  # --------------------------------------------------------------------------
  vllmCommon:
    kvTransfer:
      enabled: true
      connector: NixlConnector
      role: kv_both
    flags:
      enforceEager: true
      disableLogRequests: true
      disableUvicornAccessLog: true
      allowLongMaxModelLen: "1"
      serverDevMode: "1"
    volumes:
      - name: shared-config
        type: emptyDir
        emptyDir: {}
      - name: dshm
        type: emptyDir
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: shared-config
        mountPath: /shared-config

  # --------------------------------------------------------------------------
  # PREFILL / DECODE defaults (TP=1, single GPU per pod)
  # --------------------------------------------------------------------------
  prefill:
    enabled: false
    replicas: 0

  decode:
    initContainers:
      - name: preprocess
        imageKey: benchmark
        imagePullPolicy: Always
        command: ["set_llmdbench_environment.py", "-e", "/shared-config/llmdbench_env.sh", "-i"]
        volumeMounts:
          - name: shared-config
            mountPath: /shared-config
    parallelism:
      tensor: 1
      data: 1
      dataLocal: 1
      workers: 1
    extraEnvVars: []
    extraContainerConfig:
      ports:
        - containerPort: 5557
          protocol: TCP
        - containerPort: 8200
          name: metrics
          protocol: TCP
      securityContext:
        capabilities:
          add:
            - "IPC_LOCK"
            - "SYS_RAWIO"
        runAsGroup: 0
        runAsUser: 0
      imagePullPolicy: Always
    additionalVolumeMounts: []
    additionalVolumes: []
    probes:
      startup:
        path: /v1/models
        failureThreshold: 60
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
      liveness:
        path: /health
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5
      readiness:
        path: /v1/models
        failureThreshold: 3
        periodSeconds: 5
        timeoutSeconds: 2
    monitoring:
      podmonitor:
        enabled: true
        portName: metrics
        path: /metrics
        interval: 30s
        labels:
          release: __PROM_RELEASE__

  workDir: "__WVA_WORKDIR__"
  harness:
    name: inference-perf
    experimentProfile: ta_autoscale_ladder.yaml
    # Prevent the entrypoint's 3-attempt retry loop from re-running the whole
    # workload when inference-perf exits non-zero due to per-request errors.
    # Without this, stage 1 errors (e.g. transient timeouts under load) trigger
    # a full stage 0+stage 1 replay, which contaminates capture windows and
    # overwrites run_metadata.yaml with the last attempt's timestamps.
    extraEnvVars:
      - name: LLMDBENCH_RUN_EXPERIMENT_HARNESS_MAX_TRIES
        value: "1"

  storage:
    modelPvc:
      size: 32Gi

# ============================================================================
# SCENARIO — single TP=1 variant
# ============================================================================
scenario:
  - name: "llama-8b-tp1"

    model:
      name: __BENCHMARK_MODEL_ID__
      shortName: __BENCHMARK_MODEL_SHORTNAME__
      path: models/__BENCHMARK_MODEL_ID__
      huggingfaceId: __BENCHMARK_MODEL_ID__
      size: 32Gi
      maxModelLen: 8192
      blockSize: 64
      gpuMemoryUtilization: 0.85

    wva:
      variantAutoscaling:
        enabled: false
      hpa:
        enabled: false

    decode:
      replicas: 1
      resources:
        limits:
          memory: 32Gi
          cpu: "8"
        requests:
          memory: 32Gi
          cpu: "8"
