# Config for the sync-main script family (sync-main-session-start.sh, sync-main-watch.sh,
# sync-main-once.sh, sync-main-status.sh). Read once per invocation; not inferred, per
# feedback_tools_take_explicit_paths -- the caller/container knows its own layout, the scripts
# should not guess it. See planning/sync-watchers-spec.md S5 for the design.
#
# WORKTREE        absolute path to the worktree holding TRACKED_BRANCH.
# TRACKED_BRANCH  the branch these scripts keep fast-forwarded from UPSTREAM_REMOTE and push to
#                 origin. Status file becomes session/status/<TRACKED_BRANCH>.md.
# UPSTREAM_REMOTE name of the remote to fetch/merge from. Empty string is a valid, supported value
#                 meaning "no upstream configured" -- every script must treat that as a loud no-op,
#                 not an error, since day one of a repo with no fork-of-upstream topology has this
#                 be simply true.
WORKTREE=/home/dean/code/llm-d/llm-d-workload-variant-autoscaler/Main
TRACKED_BRANCH=main
UPSTREAM_REMOTE=upstream
